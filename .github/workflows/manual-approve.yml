name: Manual PR approval

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Number of the closed or merged pull request
        required: true
        type: number

permissions: {}

jobs:
  approve:
    name: Approve Pull Request
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: manual-approve-${{ inputs.pr_number }}
    permissions:
      pull-requests: write

    steps:
      - name: Approve current PR commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if [[ ! "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo 'A positive pull request number is required.' >&2
            exit 1
          fi

          candidate=$(gh api graphql \
            -F owner="$GITHUB_REPOSITORY_OWNER" -F repo="${GITHUB_REPOSITORY#*/}" \
            -F number="$PR_NUMBER" -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    baseRefName
                    headRefOid
                    isDraft
                    reviewDecision
                    state
                    reviews(author: "github-actions[bot]", states: [APPROVED], last: 1) {
                      nodes { commit { oid } }
                    }
                  }
                }
              }' --jq '
                .data.repository.pullRequest
                | select(.baseRefName == "main" and .isDraft == false
                    and .reviewDecision == "REVIEW_REQUIRED")
                | select(.headRefOid != .reviews.nodes[0].commit.oid)
                | [.state, .headRefOid] | @tsv')
          if [[ -z "$candidate" ]]; then
            echo 'Skipping approval because the PR does not require a new automated review.'
            exit 0
          fi

          IFS=$'\t' read -r pr_state head_sha <<< "$candidate"
          if [[ "$pr_state" != CLOSED && "$pr_state" != MERGED ]]; then
            echo 'Skipping manual approval because the PR is open.'
            exit 0
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" --silent \
            -f event=APPROVE \
            -f commit_id="$head_sha" \
            -f body='Approved through the manual GitHub Actions workflow.'
