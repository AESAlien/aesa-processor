name: CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Build, Test and Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH.' >&2
            exit 1
          fi
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtest-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error --timeout 120

      - name: Package
        run: |
          package_name="aesa-processor-${GITHUB_SHA}-linux-x86_64"
          package_dir="build/package/$package_name"
          mkdir -p "$package_dir/licenses" build/dist
          install -m 755 build/src/app/adp "$package_dir/"
          install -m 644 .env.example README.md "$package_dir/"
          install -m 644 .github/workflows/README.md "$package_dir/CI_CD.md"
          install -m 644 third_party/spdlog/LICENSE "$package_dir/licenses/spdlog.txt"
          install -m 644 third_party/magic_enum/LICENSE "$package_dir/licenses/magic_enum.txt"
          printf '%s\n' "$GITHUB_SHA" > "$package_dir/COMMIT"
          tar -czf "build/dist/$package_name.tar.gz" -C build/package "$package_name"
          cd build/dist
          sha256sum "$package_name.tar.gz" > "$package_name.tar.gz.sha256"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: aesa-processor-${{ github.sha }}-linux-x86_64
          path: build/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download tested package
        uses: actions/download-artifact@v4
        with:
          name: aesa-processor-${{ github.sha }}-linux-x86_64
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check ./*.sha256
          gh release create "$RELEASE_TAG" ./*.tar.gz ./*.sha256 \
            --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          gh release edit "$RELEASE_TAG" --draft=false
